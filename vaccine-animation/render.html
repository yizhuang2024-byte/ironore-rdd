<!doctype html>
<html><head><meta charset="utf-8"><title>render</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="anim.js"></script>
<script>
(async () => {
  const tl = await (await fetch('timeline.json')).json();
  await document.fonts.load('700 40px "Noto Sans CJK TC"'); await document.fonts.load('900 40px "Noto Sans CJK TC"'); await document.fonts.load('500 40px "Noto Sans CJK TC"');
  const ctx = document.getElementById('c').getContext('2d');
  window.renderAt = (t, subs) => { VaxAnim.render(ctx, t, tl, { subs: subs || 'both' }); return true; };
  window.TL = tl; window.ready = true;
})();
</script></body></html>
