<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:14px system-ui}img{max-width:100%}</style><title>The Mural Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root{
    --stage:#d9d6cf;
    --stage-edge:rgba(0,0,0,.18);
    --paper-1:#efe8d9;
    --paper-2:#e6dcc7;
    --paper-3:#dccfb4;
    --ink:#26241f;
    --slate:#74879c;
    --ochre:#c0873a;
    --moss:#55625a;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --stage:#191917; --stage-edge:rgba(0,0,0,.6); }
  }
  :root[data-theme="dark"]{ --stage:#191917; --stage-edge:rgba(0,0,0,.6); }

  body{ background:var(--stage); }
  .stage{
    min-height:100vh; background:var(--stage);
    display:flex; align-items:center; justify-content:center;
    padding:clamp(12px,3vw,48px);
    box-sizing:border-box;
  }

  .poster{
    position:relative;
    width:min(100%, 1200px);
    aspect-ratio:4/3;
    overflow:hidden;
    background:var(--paper-1);
    box-shadow:0 18px 60px -24px var(--stage-edge), 0 2px 6px -2px var(--stage-edge);
    container-type:inline-size;
    isolation:isolate;
  }

  /* ---------- aged paper ground ---------- */
  .paper{
    position:absolute; inset:0;
    background:
      radial-gradient(120% 90% at 78% 18%, rgba(255,253,246,.85) 0%, rgba(255,253,246,0) 55%),
      radial-gradient(70% 55% at 96% 96%, rgba(176,152,110,.28) 0%, rgba(176,152,110,0) 70%),
      radial-gradient(50% 40% at 62% 68%, rgba(184,160,118,.16) 0%, rgba(184,160,118,0) 72%),
      linear-gradient(103deg, var(--paper-2) 0%, var(--paper-1) 38%, var(--paper-2) 78%, var(--paper-3) 100%);
  }
  .paper-fiber{ position:absolute; inset:0; opacity:.5; mix-blend-mode:multiply; pointer-events:none; }
  .paper-edge{
    position:absolute; inset:0; pointer-events:none;
    box-shadow:
      inset 0 0 0 1px rgba(120,101,70,.16),
      inset 0 0 46px rgba(122,102,68,.13),
      inset -22px 0 40px -28px rgba(96,80,52,.5),
      inset 0 -26px 44px -30px rgba(96,80,52,.42);
  }

  /* ---------- left: the photograph ---------- */
  .plate{
    position:absolute; top:0; left:0; bottom:0;
    width:50.4%;
    -webkit-mask-image:linear-gradient(90deg, #000 0, #000 calc(100% - 30px), rgba(0,0,0,.75) calc(100% - 11px), rgba(0,0,0,0) 100%);
    mask-image:linear-gradient(90deg, #000 0, #000 calc(100% - 30px), rgba(0,0,0,.75) calc(100% - 11px), rgba(0,0,0,0) 100%);
  }

    mix-blend-mode:multiply;
  }
  .notes .row{ display:flex; align-items:baseline; justify-content:space-between; gap:2cqw; }
  .rule{
    height:1px; margin:1.15cqw 0 .95cqw;
    background:repeating-linear-gradient(90deg, rgba(38,36,31,.62) 0 14px, rgba(38,36,31,.16) 14px 19px, rgba(38,36,31,.5) 19px 33px, rgba(38,36,31,0) 33px 36px);
    opacity:.75;
  }
  .place{
    font-size:1.62cqw; font-weight:700; letter-spacing:.19em;
    text-transform:uppercase; white-space:nowrap;
  }
  .idx{ font-size:1.02cqw; letter-spacing:.14em; opacity:.72; }
  .keys{ font-size:1.02cqw; letter-spacing:.155em; text-transform:uppercase; opacity:.86; }
  .year{ font-size:1.02cqw; letter-spacing:.2em; opacity:.72; font-variant-numeric:tabular-nums; }
  .notes .place, .notes .idx, .notes .keys, .notes .year{ filter:url(#typeBite); }

  .poster-grain{ position:absolute; inset:0; opacity:.34; mix-blend-mode:multiply; pointer-events:none; }

  @container (max-width: 620px){
    .place{ font-size:1.9cqw; }
    .idx, .keys, .year{ font-size:1.25cqw; }
  }
</style>

<div class="stage">
  <div class="poster">

    <!-- filters + textures -->
    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
      <defs>
        <!-- ragged carved edge, one seed per ink layer -->
        <filter id="carveA" x="-12%" y="-12%" width="124%" height="124%">
          <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="3" seed="11" result="lo"/>
          <feDisplacementMap in="SourceGraphic" in2="lo" scale="3.4" xChannelSelector="R" yChannelSelector="G" result="w"/>
          <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="2" seed="4" result="hi"/>
          <feDisplacementMap in="w" in2="hi" scale="1.9" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="carveB" x="-12%" y="-12%" width="124%" height="124%">
          <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="3" seed="29" result="lo"/>
          <feDisplacementMap in="SourceGraphic" in2="lo" scale="3.9" xChannelSelector="R" yChannelSelector="G" result="w"/>
          <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="17" result="hi"/>
          <feDisplacementMap in="w" in2="hi" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="carveC" x="-12%" y="-12%" width="124%" height="124%">
          <feTurbulence type="fractalNoise" baseFrequency="0.017" numOctaves="3" seed="43" result="lo"/>
          <feDisplacementMap in="SourceGraphic" in2="lo" scale="4.6" xChannelSelector="R" yChannelSelector="G" result="w"/>
          <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="8" result="hi"/>
          <feDisplacementMap in="w" in2="hi" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="carveD" x="-14%" y="-14%" width="128%" height="128%">
          <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="3" seed="61" result="lo"/>
          <feDisplacementMap in="SourceGraphic" in2="lo" scale="5.6" xChannelSelector="R" yChannelSelector="G" result="w"/>
          <feTurbulence type="fractalNoise" baseFrequency="0.48" numOctaves="2" seed="23" result="hi"/>
          <feDisplacementMap in="w" in2="hi" scale="3.1" xChannelSelector="R" yChannelSelector="G"/>
        </filter>

        <!-- dry-ink shortage: sparse pale gaps in the impression -->
        <filter id="dryA" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.33 0.41" numOctaves="4" seed="5"/>
          <feColorMatrix type="luminanceToAlpha"/>
          <feComponentTransfer><feFuncA type="gamma" amplitude="1.35" exponent="0.42" offset="0.30"/></feComponentTransfer>
        </filter>
        <filter id="dryB" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.26 0.37" numOctaves="4" seed="34"/>
          <feColorMatrix type="luminanceToAlpha"/>
          <feComponentTransfer><feFuncA type="gamma" amplitude="1.3" exponent="0.5" offset="0.24"/></feComponentTransfer>
        </filter>
        <filter id="dryC" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.19 0.3" numOctaves="4" seed="52"/>
          <feColorMatrix type="luminanceToAlpha"/>
          <feComponentTransfer><feFuncA type="gamma" amplitude="1.25" exponent="0.62" offset="0.16"/></feComponentTransfer>
        </filter>

        <!-- uneven hand pressure across the block -->
        <linearGradient id="press1" x1="0" y1="0" x2="1" y2="0.7">
          <stop offset="0" stop-color="#fff" stop-opacity=".72"/>
          <stop offset=".34" stop-color="#fff" stop-opacity="1"/>
          <stop offset=".82" stop-color="#fff" stop-opacity=".92"/>
          <stop offset="1" stop-color="#fff" stop-opacity=".6"/>
        </linearGradient>
        <linearGradient id="press2" x1="0.1" y1="1" x2="0.9" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity=".58"/>
          <stop offset=".45" stop-color="#fff" stop-opacity="1"/>
          <stop offset="1" stop-color="#fff" stop-opacity=".78"/>
        </linearGradient>

        <mask id="mA" maskUnits="userSpaceOnUse" x="-30" y="-30" width="500" height="420" style="mask-type:alpha">
          <rect x="-30" y="-30" width="500" height="420" fill="#fff" filter="url(#dryA)"/>
          <rect x="-30" y="-30" width="500" height="420" fill="url(#press1)" style="mix-blend-mode:multiply"/>
        </mask>
        <mask id="mB" maskUnits="userSpaceOnUse" x="-30" y="-30" width="500" height="420" style="mask-type:alpha">
          <rect x="-30" y="-30" width="500" height="420" fill="#fff" filter="url(#dryB)"/>
          <rect x="-30" y="-30" width="500" height="420" fill="url(#press2)" style="mix-blend-mode:multiply"/>
        </mask>
        <mask id="mC" maskUnits="userSpaceOnUse" x="-30" y="-30" width="500" height="420" style="mask-type:alpha">
          <rect x="-30" y="-30" width="500" height="420" fill="#fff" filter="url(#dryC)"/>
          <rect x="-30" y="-30" width="500" height="420" fill="url(#press1)" style="mix-blend-mode:multiply"/>
        </mask>

        <!-- slight mechanical bite on typed characters -->
        <filter id="typeBite" x="-6%" y="-14%" width="112%" height="128%">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="13" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="0.75" xChannelSelector="R" yChannelSelector="G"/>
        </filter>

        <!-- paper fibre + film grain -->
        <filter id="fiber">
          <feTurbulence type="fractalNoise" baseFrequency="0.023 0.75" numOctaves="4" seed="2"/>
          <feColorMatrix type="matrix" values="0 0 0 0 .46  0 0 0 0 .40  0 0 0 0 .29  0 0 0 .32 0"/>
        </filter>
        <filter id="filmgrain">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="21"/>
          <feColorMatrix type="saturate" values="0"/>
          <feComponentTransfer><feFuncA type="linear" slope="0.5" intercept="0"/></feComponentTransfer>
        </filter>
        <filter id="pressgrain">
          <feTurbulence type="fractalNoise" baseFrequency="0.42" numOctaves="4" seed="9"/>
          <feColorMatrix type="matrix" values="0 0 0 0 .42  0 0 0 0 .37  0 0 0 0 .28  0 0 0 .22 0"/>
        </filter>
      </defs>
    </svg>

    <div class="paper"></div>
    <svg class="paper-fiber" aria-hidden="true"><rect width="100%" height="100%" filter="url(#fiber)"/></svg>

    <div class="plate">
      <div class="plate-img" role="img" aria-label="Café seating hall: oak tables and chairs beneath a large painted mural on a deep green wall, lit by black track lighting."></div>
      <div class="plate-grade"></div>
      <svg class="plate-grain" aria-hidden="true"><rect width="100%" height="100%" filter="url(#filmgrain)"/></svg>
    </div>
    <div class="seam"></div>

    <!-- ================= the stamp ================= -->
    <div class="stamp">
      <svg viewBox="0 0 440 360" aria-label="Four-colour rubber stamp compressing the café interior: track rail and lamps, the framed mural, a round oak table and a chair silhouette.">

        <!-- MOSS: the wall, a low-pressure wash -->
        <g mask="url(#mC)" opacity=".38" transform="translate(-1.4,-2.2)">
          <g filter="url(#carveD)" fill="#55625a">
            <path d="M24 88 L418 82 L420 240 Q222 249 22 243 Z"/>
          </g>
        </g>

        <!-- SLATE: mural water field, leaf mottle, hair -->
        <g mask="url(#mB)" opacity=".9" transform="translate(-2.3,1.6)">
          <g filter="url(#carveB)" fill="#74879c">
            <path d="M68 228 L68 191 C102 179 141 197 179 191 C215 185 251 173 293 179 C321 183 351 177 375 173 L375 228 Z"/>
            <path d="M150 130 C127 129 115 147 115 171 C111 197 117 214 126 227 L97 227 C88 200 91 156 109 140 C119 131 136 126 150 130 Z"/>
            <path d="M330 120 c16 -3 27 6 26 17 c-1 12 -13 19 -25 17 c-12 -2 -19 -10 -18 -19 c1 -8 8 -14 17 -15 Z" opacity=".72"/>
          </g>
        </g>

        <!-- OCHRE: coral fan in the mural, oak table top, lamp spill -->
        <g mask="url(#mA)" opacity=".92" transform="translate(1.7,-1.1)">
          <g filter="url(#carveA)" fill="#c0873a">
            <path d="M216 214 c-2 -22 -1 -44 1 -64 c1 -6 9 -6 10 0 c2 20 3 42 2 64 Z" transform="rotate(-9 221 214)"/>
            <path d="M233 214 c-3 -26 -2 -52 0 -74 c1 -6 9 -6 10 0 c2 22 3 48 1 74 Z" transform="rotate(-3.5 238 214)"/>
            <path d="M250 214 c-3 -27 -2 -55 0 -78 c1 -6 9 -6 10 0 c2 23 3 51 1 78 Z" transform="rotate(1.5 255 214)"/>
            <path d="M267 214 c-3 -24 -2 -48 0 -69 c1 -6 9 -6 10 0 c2 21 3 45 1 69 Z" transform="rotate(6.5 272 214)"/>
            <path d="M284 214 c-3 -20 -2 -39 0 -56 c1 -6 9 -6 10 0 c2 17 3 36 1 56 Z" transform="rotate(11 289 214)"/>
            <path d="M210 210 q46 -12 92 0 q2 8 0 14 q-46 -9 -92 0 Z"/>
            <ellipse cx="118" cy="272" rx="76" ry="19"/>
            <path d="M287 303 L387 298 L390 312 L290 317 Z" opacity=".85"/>
            <path d="M203 66 L226 66 L268 128 L188 128 Z" opacity=".2"/>
          </g>
        </g>

        <!-- MOSS again: the big leaf blade crossing the mural -->
        <g mask="url(#mA)" opacity=".62" transform="translate(-0.8,-1.4)">
          <g filter="url(#carveC)" fill="#55625a">
            <path d="M300 148 c26 12 46 34 54 60 c-28 -2 -52 -18 -64 -42 c-4 -8 -1 -18 10 -18 Z"/>
            <path d="M126 196 c14 8 22 22 24 38 c-16 0 -30 -10 -36 -25 c-3 -8 3 -16 12 -13 Z" opacity=".7"/>
          </g>
        </g>

        <!-- INK: rail, lamps, frame, figure, pedestal, chair, floor -->
        <g mask="url(#mA)" opacity=".93">
          <g filter="url(#carveA)" fill="#26241f" stroke="#26241f" stroke-linecap="round" stroke-linejoin="round">
            <!-- track rail + three lamp heads -->
            <path d="M14 44 L426 40 L426 48 L14 52 Z"/>
            <g>
              <rect x="87" y="50" width="3.4" height="13" transform="rotate(-4 88.7 56)"/>
              <rect x="81" y="62" width="14" height="20" rx="2.6" transform="rotate(-4 88 72)"/>
              <rect x="209" y="49" width="3.4" height="13" transform="rotate(3 210.7 55)"/>
              <rect x="203" y="61" width="14" height="20" rx="2.6" transform="rotate(3 210 71)"/>
              <rect x="331" y="48" width="3.4" height="13" transform="rotate(-2 332.7 54)"/>
              <rect x="325" y="60" width="14" height="20" rx="2.6" transform="rotate(-2 332 70)"/>
            </g>
            <!-- mural frame -->
            <path d="M62 104 L378 100 L380 230 L64 233 Z" fill="none" stroke-width="5.4"/>
            <!-- figure: profile contour + arm -->
            <path d="M128 176 C124 150 133 131 151 131 C164 131 169 143 167 152 L173 158 L166 161 C166 168 161 173 155 172 C153 178 153 183 155 187" fill="none" stroke-width="3.6"/>
            <path d="M155 189 C163 197 177 201 191 207 C199 211 203 217 204 225" fill="none" stroke-width="3.2"/>
            <!-- table pedestal + base -->
            <path d="M113 272 L123 272 L124 322 L112 322 Z"/>
            <ellipse cx="118" cy="326" rx="32" ry="7"/>
            <!-- foreground chair -->
            <g stroke-width="4.6" fill="none" transform="rotate(-1 334 278)">
              <path d="M296 216 L300 300"/>
              <path d="M374 212 L372 297"/>
              <path d="M294 218 L376 214"/>
              <path d="M297 244 L375 240"/>
              <path d="M298 268 L374 264"/>
              <path d="M285 302 L389 297 L392 313 L288 318 Z" stroke-width="4"/>
              <path d="M293 316 L297 346"/>
              <path d="M384 311 L380 342"/>
              <path d="M299 333 L382 329" stroke-width="3"/>
            </g>
            <!-- floorboards -->
            <g stroke-width="2.6" stroke-dasharray="26 13 40 16" opacity=".8">
              <path d="M36 344 L162 341"/>
              <path d="M232 353 L404 349"/>
            </g>
          </g>
        </g>

        <!-- ghost impression: the block rocked once under the hand -->
        <g mask="url(#mB)" opacity=".075" transform="translate(3.4,2.6)">
          <g filter="url(#carveB)" fill="#26241f" stroke="#26241f" stroke-linejoin="round">
            <path d="M62 104 L378 100 L380 230 L64 233 Z" fill="none" stroke-width="5"/>
            <path d="M14 44 L426 40 L426 48 L14 52 Z"/>
            <ellipse cx="118" cy="272" rx="76" ry="19"/>
            <path d="M285 302 L389 297 L392 313 L288 318 Z" fill="none" stroke-width="4"/>
          </g>
        </g>
      </svg>
    </div>

    <!-- ================= field notes ================= -->
    <div class="notes">
      <div class="row">
        <span class="place">The Mural Room</span>
        <span class="idx">No. 014</span>
      </div>
      <div class="rule"></div>
      <div class="row">
        <span class="keys">Oak &middot; Mural &middot; Track Light</span>
        <span class="year">2026</span>
      </div>
    </div>

    <svg class="poster-grain" aria-hidden="true"><rect width="100%" height="100%" filter="url(#pressgrain)"/></svg>
    <div class="paper-edge"></div>
  </div>
</div>
</html>
